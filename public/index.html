<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archipelago Async</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#4f46e5',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center cursor-pointer" onclick="showHome()">
                    <span class="text-xl font-bold text-primary">Archipelago Async</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="global-timer" class="text-lg font-mono bg-gray-900 px-3 py-1 rounded-lg border border-gray-700">
                        00:00:00
                    </div>
                    <div id="auth-buttons" class="flex space-x-2">
                        <button onclick="openModal('login-modal')" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium">Login</button>
                        <button onclick="openModal('register-modal')" class="px-4 py-2 bg-primary hover:bg-secondary rounded-lg text-sm font-medium">Register</button>
                    </div>
                    <div id="user-menu" class="hidden flex items-center space-x-3">
                        <span id="username-display" class="text-sm font-medium"></span>
                        <button id="settings-btn" onclick="openModal('settings-modal')" class="hidden px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm">Settings</button>
                        <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm font-medium">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="home-view">
            <h1 class="text-3xl font-bold mb-6">Available Games</h1>
            <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Games injected here -->
            </div>
        </div>
        <div id="game-view" class="hidden">
            <!-- Game details injected here -->
        </div>
    </main>

    <!-- Modals -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">Login</h2>
            <input type="text" id="login-user" placeholder="Username" class="w-full p-2 mb-3 bg-gray-900 border border-gray-700 rounded">
            <input type="password" id="login-pass" placeholder="Password" class="w-full p-2 mb-4 bg-gray-900 border border-gray-700 rounded">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModals()" class="px-4 py-2 bg-gray-700 rounded">Cancel</button>
                <button onclick="login()" class="px-4 py-2 bg-primary rounded">Login</button>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal hidden">
        <div class="modal-content bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">Register</h2>
            <input type="text" id="reg-user" placeholder="Username" class="w-full p-2 mb-3 bg-gray-900 border border-gray-700 rounded">
            <input type="password" id="reg-pass" placeholder="Password" class="w-full p-2 mb-4 bg-gray-900 border border-gray-700 rounded">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModals()" class="px-4 py-2 bg-gray-700 rounded">Cancel</button>
                <button onclick="register()" class="px-4 py-2 bg-primary rounded">Register</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-4">Event Settings</h2>
            <label class="block text-sm mb-1">Start Date & Time</label>
            <input type="datetime-local" id="set-start" class="w-full p-2 mb-3 bg-gray-900 border border-gray-700 rounded">
            <label class="block text-sm mb-1">End Date & Time</label>
            <input type="datetime-local" id="set-end" class="w-full p-2 mb-4 bg-gray-900 border border-gray-700 rounded">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModals()" class="px-4 py-2 bg-gray-700 rounded">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-primary rounded">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
