<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - The Ultimate Challenge</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ap: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8',
                            success: '#22c55e',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .game-logo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <img src="/favicon.png" alt="Game Logo" class="game-logo" style="width: 48px; height: 48px;">
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">The Ultimate Challenge</h1>
                        <p class="text-xs text-slate-400">Settings</p>
                    </div>
                </a>
            </div>

            <nav class="flex items-center gap-4">
                <div id="current-player-display" class="flex items-center gap-2 text-sm">
                    <span class="text-slate-400">Playing as:</span>
                    <span id="current-player-name" class="font-semibold text-ap-accent">Not logged in</span>
                </div>
                <div class="w-px h-5 bg-slate-600"></div>
                <a href="/" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Games</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
        <!-- Moderator Section -->
        <div id="moderator-section" class="glass rounded-xl p-8 mb-8" style="display:none;">
            <h2 class="text-2xl font-bold text-white mb-6"><i class="fa-solid fa-medal text-ap-accent mr-2"></i>Award Management</h2>
            
            <!-- Add New Award -->
            <div class="mb-8 pb-8 border-b border-slate-700">
                <h3 class="text-lg font-semibold text-white mb-4">Create New Award</h3>
                <form id="add-award-form" class="space-y-4">
                    <div>
                        <label for="award-name" class="block text-sm font-medium text-slate-300 mb-2">Award Name</label>
                        <input 
                            type="text" 
                            id="award-name" 
                            name="award_name" 
                            placeholder="e.g., Speed Demon"
                            required
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                        >
                    </div>
                    
                    <div>
                        <label for="award-icon" class="block text-sm font-medium text-slate-300 mb-2">Icon (Emoji or FontAwesome)</label>
                        <input 
                            type="text" 
                            id="award-icon" 
                            name="award_icon" 
                            placeholder="e.g., ⚡ or fa-solid fa-bolt"
                            required
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                        >
                        <p class="text-xs text-slate-400 mt-1">Use an emoji (⚡🏆🎯) or FontAwesome class (fa-solid fa-star)</p>
                    </div>
                    
                    <div>
                        <label for="award-description" class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                        <textarea 
                            id="award-description" 
                            name="award_description" 
                            placeholder="Describe what this award is for..."
                            rows="3"
                            required
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors resize-vertical"
                        ></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-ap-accent hover:bg-sky-600 text-slate-900 font-medium py-3 px-6 rounded-lg transition-colors">
                        <i class="fa-solid fa-plus mr-2"></i>Create Award
                    </button>
                </form>
            </div>
            
            <!-- Assign Award to Player -->
            <div>
                <h3 class="text-lg font-semibold text-white mb-4">Assign Award to Player</h3>
                <form id="assign-award-form" class="space-y-4">
                    <div>
                        <label for="award-player" class="block text-sm font-medium text-slate-300 mb-2">Select Player</label>
                        <select 
                            id="award-player" 
                            name="award_player"
                            required
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                        >
                            <option value="">Choose a player...</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="award-select" class="block text-sm font-medium text-slate-300 mb-2">Select Award</label>
                        <select 
                            id="award-select" 
                            name="award_select"
                            required
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                        >
                            <option value="">Choose an award...</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="w-full bg-ap-success hover:bg-green-600 text-white font-medium py-3 px-6 rounded-lg transition-colors">
                        <i class="fa-solid fa-check mr-2"></i>Assign Award
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Profile Settings -->
        <div class="glass rounded-xl p-8">
            <h2 class="text-2xl font-bold text-white mb-6">Profile Settings</h2>
            <form id="settings-form" class="space-y-6">
                <div>
                    <label for="profile-pic" class="block text-sm font-medium text-slate-300 mb-2">Profile Picture</label>
                    <input 
                        type="url" 
                        id="profile-pic" 
                        name="profile_pic" 
                        placeholder="https://example.com/avatar.jpg"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                    >
                    <img id="pic-preview" class="preview-image mt-3 w-24 h-24 rounded-full object-cover hidden" alt="Preview">
                </div>

                <div>
                    <label for="bio" class="block text-sm font-medium text-slate-300 mb-2">Bio</label>
                    <textarea 
                        id="bio" 
                        name="bio" 
                        placeholder="Tell us about yourself..."
                        rows="4"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors resize-vertical"
                    ></textarea>
                </div>

                <div>
                    <label for="pronouns" class="block text-sm font-medium text-slate-300 mb-2">Pronouns</label>
                    <input 
                        type="text" 
                        id="pronouns" 
                        name="pronouns" 
                        placeholder="they/them"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                    >
                </div>

                <div>
                    <label for="discord" class="block text-sm font-medium text-slate-300 mb-2">Discord Username</label>
                    <input 
                        type="text" 
                        id="discord" 
                        name="discord" 
                        placeholder="username"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                    >
                </div>

                <button type="submit" class="w-full bg-ap-success hover:bg-green-600 text-white font-medium py-3 px-6 rounded-lg transition-colors">
                    Save Changes
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>Powered by <a href="https://github.com" class="underline" target="_blank" rel="noopener noreferrer">GitHub</a> & <a href="https://vercel.com" class="underline" target="_blank" rel="noopener noreferrer">Vercel</a> • Data is stored directly in the <a href="https://github.com/Ayden123kitten/The-Ultimate-Challenge" class="underline">repository</a></p>
    </footer>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('settings-form');
            const picInput = document.getElementById('profile-pic');
            const picPreview = document.getElementById('pic-preview');
            
            // Check auth and load data
            const user = localStorage.getItem('ap_async_player');
            if (!user) {
                window.location.href = 'index.html'; // Redirect if not logged in
                return;
            }

            const settingsLink = document.getElementById('settings-link');
            if(settingsLink) settingsLink.style.display = 'block';

            let isModerator = false;
            let players = [];
            let awards = [];

            try {
                // Check moderator status
                isModerator = await AUTH.checkModerator();
                
                const res = await fetch('/api/players');
                players = await res.json();
                const currentPlayer = players.find(p => p.name === user);

                if (currentPlayer) {
                    document.getElementById('profile-pic').value = currentPlayer.pfp_link || '';
                    document.getElementById('bio').value = currentPlayer.bio || '';
                    document.getElementById('pronouns').value = currentPlayer.pronouns || '';
                    document.getElementById('discord').value = currentPlayer.discord || '';
                    
                    if(currentPlayer.pfp_link) {
                        picPreview.src = currentPlayer.pfp_link;
                        picPreview.classList.remove('hidden');
                    }
                }
                
                // Load awards for dropdown
                const awardsRes = await fetch('/api/get-awards');
                if (awardsRes.ok) {
                    const awardsData = await awardsRes.json();
                    awards = awardsData.awards || [];
                }
                
                // Show moderator section if user is a moderator
                if (isModerator) {
                    document.getElementById('moderator-section').style.display = 'block';
                    
                    // Populate player dropdown
                    const playerSelect = document.getElementById('award-player');
                    players.forEach(player => {
                        const option = document.createElement('option');
                        option.value = player.name;
                        option.textContent = player.name;
                        playerSelect.appendChild(option);
                    });
                    
                    // Populate award dropdown
                    const awardSelect = document.getElementById('award-select');
                    awards.forEach(award => {
                        const option = document.createElement('option');
                        option.value = JSON.stringify({ name: award.name, icon: award.icon, description: award.description });
                        option.textContent = `${award.icon} ${award.name}`;
                        awardSelect.appendChild(option);
                    });
                }
            } catch (err) {
                console.error('Failed to load settings', err);
            }

            // Image preview listener
            picInput.addEventListener('input', (e) => {
                if(e.target.value) {
                    picPreview.src = e.target.value;
                    picPreview.classList.remove('hidden');
                } else {
                    picPreview.classList.add('hidden');
                }
            });

            // Save handler
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                try {
                    const res = await fetch('/api/update-profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: user,
                            data: {
                                pfp_link: data.profile_pic,
                                bio: data.bio,
                                pronouns: data.pronouns,
                                discord: data.discord
                            }
                        })
                    });

                    if (res.ok) {
                        alert('Settings saved successfully!');
                    } else {
                        const err = await res.json();
                        alert('Error saving settings: ' + err.error);
                    }
                } catch (err) {
                    alert('Failed to save settings.');
                }
            });
            
            // Add Award handler (moderator only)
            if (isModerator) {
                const addAwardForm = document.getElementById('add-award-form');
                addAwardForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const awardData = {
                        name: document.getElementById('award-name').value,
                        icon: document.getElementById('award-icon').value,
                        description: document.getElementById('award-description').value
                    };
                    
                    try {
                        const res = await fetch('/api/manage-awards', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                ...AUTH.authHeader()
                            },
                            body: JSON.stringify({
                                action: 'addAward',
                                awardData: awardData
                            })
                        });
                        
                        if (res.ok) {
                            alert('Award created successfully!');
                            addAwardForm.reset();
                            // Reload awards
                            const awardsRes = await fetch('/api/get-awards');
                            if (awardsRes.ok) {
                                const awardsData = await awardsRes.json();
                                awards = awardsData.awards || [];
                                // Refresh award dropdown
                                const awardSelect = document.getElementById('award-select');
                                awardSelect.innerHTML = '<option value="">Choose an award...</option>';
                                awards.forEach(award => {
                                    const option = document.createElement('option');
                                    option.value = JSON.stringify({ name: award.name, icon: award.icon, description: award.description });
                                    option.textContent = `${award.icon} ${award.name}`;
                                    awardSelect.appendChild(option);
                                });
                            }
                        } else {
                            const err = await res.json();
                            alert('Error creating award: ' + err.error);
                        }
                    } catch (err) {
                        alert('Failed to create award.');
                    }
                });
                
                // Assign Award handler
                const assignAwardForm = document.getElementById('assign-award-form');
                assignAwardForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const playerName = document.getElementById('award-player').value;
                    const awardInfo = JSON.parse(document.getElementById('award-select').value);
                    
                    try {
                        const res = await fetch('/api/manage-awards', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                ...AUTH.authHeader()
                            },
                            body: JSON.stringify({
                                action: 'assignAward',
                                assignAwardData: {
                                    playerName: playerName,
                                    awardName: awardInfo.name,
                                    icon: awardInfo.icon,
                                    description: awardInfo.description,
                                    action: 'add'
                                }
                            })
                        });
                        
                        if (res.ok) {
                            alert('Award assigned successfully!');
                            assignAwardForm.reset();
                        } else {
                            const err = await res.json();
                            alert('Error assigning award: ' + err.error);
                        }
                    } catch (err) {
                        alert('Failed to assign award.');
                    }
                });
            }
        });
    </script>
</body>
</html>
