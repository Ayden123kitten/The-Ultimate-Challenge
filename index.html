<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Challenge</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ap: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8',
                            success: '#22c55e',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .game-logo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .cover-art-container { width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .cover-art-logo { max-width: 100%; max-height: 200px; object-fit: contain; image-rendering: auto; }
        .game-card-header { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; text-align: center; }
        .game-card-title-time-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 1rem; }
        .game-card-title { flex: 1; text-align: left; }
        .game-card-time { flex-shrink: 0; text-align: right; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header & Global Timer -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="/favicon.png" alt="Game Logo" class="game-logo" style="width: 48px; height: 48px;">
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">The Ultimate Challenge</h1>
                    <p class="text-xs text-slate-400">Hardest Settings • Single Slot • Shared Saves</p>
                </div>
            </div>
            
            <div class="flex flex-col items-center">
                <div id="global-timer" class="text-3xl font-mono font-bold text-ap-accent">00:00:00</div>
                <div id="timer-status" class="text-xs text-slate-400 uppercase tracking-widest">Loading...</div>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden md:flex items-center gap-2 text-sm">
                    <span class="text-slate-400">Completed:</span>
                    <span id="total-games-count" class="font-semibold text-ap-accent">0/20</span>
                </div>
                <div class="w-px h-5 bg-slate-600"></div>
                <a href="/players.html" class="text-slate-400 hover:text-ap-accent transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-users"></i>
                    <span class="text-sm">Players</span>
                </a>
                <div class="w-px h-5 bg-slate-600"></div>
                <div id="current-player-display" class="hidden md:flex items-center gap-2 text-sm">
                    <span class="text-slate-400">Playing as:</span>
                    <span id="current-player-name" class="font-semibold text-ap-accent">No player selected</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Filter & Search Row -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="w-full md:w-auto">
                <label for="games-filter" class="text-sm text-slate-400 mr-2">Show:</label>
                <select id="games-filter" class="bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors">
                    <option value="all">All Games</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="w-full md:flex-1">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input 
                        type="text" 
                        id="games-search" 
                        placeholder="Search games..." 
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg pl-12 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
                    >
                </div>
            </div>
        </div>
        
        <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Games will be injected here -->
            <div class="col-span-full text-center py-20 text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                <p>Loading Games...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>Powered by GitHub & Vercel • Data is stored directly in the <a href="https://github.com/Ayden123kitten/The-Ultimate-Challenge" class="underline">repository</a></p>
    </footer>

    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
