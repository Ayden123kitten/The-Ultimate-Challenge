<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Chalenge</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ap: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8',
                            success: '#22c55e',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header & Global Timer -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-gamepad text-3xl text-ap-accent"></i>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">The Ultimate Challenge</h1>
                    <p class="text-xs text-slate-400">Hardest Settings • Single Slot • Shared Saves</p>
                </div>
            </div>
            
            <div class="flex flex-col items-center">
                <div id="global-timer" class="text-3xl font-mono font-bold text-ap-accent">00:00:00</div>
                <div id="timer-status" class="text-xs text-slate-400 uppercase tracking-widest">Loading...</div>
            </div>

            <div class="flex items-center gap-3">
                <label class="text-sm text-slate-400">Playing as:</label>
                <select id="player-select" class="bg-slate-800 border border-slate-600 text-white text-sm rounded-lg px-3 py-2 focus:ring-2 focus:ring-ap-accent outline-none">
                    <option value="">Select Player...</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Games will be injected here -->
            <div class="col-span-full text-center py-20 text-slate-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                <p>Loading games from repository...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>Powered by GitHub & Vercel • Data is stored directly in the repository</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
