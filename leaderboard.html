<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - The Ultimate Challenge</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ap: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8',
                            success: '#22c55e',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .game-logo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .rank-1 { background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05)); border-color: gold !important; }
        .rank-2 { background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(192, 192, 192, 0.05)); border-color: silver !important; }
        .rank-3 { background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), rgba(205, 127, 50, 0.05)); border-color: #cd7f32 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <img src="/favicon.png" alt="Game Logo" class="game-logo" style="width: 48px; height: 48px;">
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">The Ultimate Challenge</h1>
                        <p class="text-xs text-slate-400">Leaderboard</p>
                    </div>
                </a>
            </div>

            <nav class="flex items-center gap-4">
                <div id="current-player-display" class="flex items-center gap-2 text-sm">
                    <span class="text-slate-400">Playing as:</span>
                    <span id="current-player-name" class="font-semibold text-ap-accent">Not logged in</span>
                </div>
                <div class="w-px h-5 bg-slate-600"></div>
                <a href="/" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Games</span>
                </a>
                <a href="/settings.html" id="settings-nav-link" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2" style="display:none;">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Tabs for different ranking categories -->
        <div class="mb-8">
            <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                <button id="tab-games" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-ap-accent/20 text-ap-accent border border-ap-accent/30 transition-all">
                    <i class="fa-solid fa-gamepad mr-2"></i>Games Played
                </button>
                <button id="tab-time" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition-all">
                    <i class="fa-solid fa-clock mr-2"></i>Total Time
                </button>
                <button id="tab-claims" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition-all">
                    <i class="fa-solid fa-clipboard-list mr-2"></i>Total Claims
                </button>
                <button id="tab-completion" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition-all">
                    <i class="fa-solid fa-percent mr-2"></i>Completion Rate
                </button>
            </div>
        </div>

        <!-- Leaderboard Table -->
        <div class="glass rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Rank</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Player</th>
                            <th class="px-6 py-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider" id="metric-header">Games Played</th>
                            <th class="px-6 py-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider hidden md:table-cell">Avg Time/Game</th>
                            <th class="px-6 py-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider hidden lg:table-cell">Total Time</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-700">
                        <!-- Leaderboard rows will be injected here -->
                        <tr>
                            <td colspan="5" class="px-6 py-20 text-center text-slate-500">
                                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                                <p>Loading Leaderboard...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Top Players Cards (Mobile View) -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4" id="top-players-cards">
            <!-- Top 3 cards will be injected here -->
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>Powered by <a href="https://github.com" class="underline" target="_blank" rel="noopener noreferrer">GitHub</a> & <a href="https://vercel.com" class="underline" target="_blank" rel="noopener noreferrer">Vercel</a> • Data is stored directly in the <a href="https://github.com/Ayden123kitten/The-Ultimate-Challenge" class="underline">repository</a></p>
    </footer>

    <script src="auth.js"></script>
    <script src="leaderboard.js"></script>
</body>
</html>
