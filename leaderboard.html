<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - The Ultimate Challenge</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ap: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8',
                            success: '#22c55e',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .game-logo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .rank-1 { background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05)); border-color: gold !important; }
        .rank-2 { background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(192, 192, 192, 0.05)); border-color: silver !important; }
        .rank-3 { background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), rgba(205, 127, 50, 0.05)); border-color: #cd7f32 !important; }
        /* Mobile menu transition */
        #mobile-menu { transition: all 0.3s ease-in-out; }
        /* Fixed column widths for consistent positioning */
        .col-rank { width: 80px; min-width: 80px; }
        .col-player { width: auto; min-width: 150px; }
        .col-metric { width: 120px; min-width: 120px; }
        .col-avg-time { width: 130px; min-width: 130px; }
        .col-total-time { width: 120px; min-width: 120px; }
        /* Table with fixed layout for consistent column positions */
        table.w-full { table-layout: fixed; }
        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .ranking-tab { padding-left: 0.75rem; padding-right: 0.75rem; font-size: 0.875rem; }
            .ranking-tab i { margin-right: 0.25rem; }
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr !important; }
            .flex-wrap { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                    <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                        <img src="/favicon.png" alt="Game Logo" class="game-logo" style="width: 48px; height: 48px;">
                        <div>
                            <h1 class="text-xl font-bold text-white tracking-tight">The Ultimate Challenge</h1>
                            <p class="text-xs text-slate-400">Leaderboard</p>
                        </div>
                    </a>
                    
                    <!-- Mobile menu button -->
                    <button id="mobile-menu-btn" class="sm:hidden text-slate-400 hover:text-white transition-colors p-2">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>

                <nav id="nav-container" class="flex items-center gap-4 flex-wrap justify-center w-full sm:w-auto">
                    <div id="current-player-display" class="flex items-center gap-2 text-sm">
                        <span class="text-slate-400 hidden sm:inline">Playing as:</span>
                        <span id="current-player-name" class="font-semibold text-ap-accent">Not logged in</span>
                    </div>
                    <div class="w-px h-5 bg-slate-600 hidden sm:block"></div>
                    <a href="/" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span class="hidden sm:inline">Back to Games</span>
                        <span class="sm:hidden">Back</span>
                    </a>
                    <a href="/settings.html" id="settings-nav-link" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2" style="display:none;">
                        <i class="fa-solid fa-gear"></i>
                        <span class="hidden sm:inline">Settings</span>
                    </a>
                </nav>
            </div>
            
            <!-- Mobile Menu (hidden by default) -->
            <div id="mobile-menu" class="hidden sm:hidden mt-4 pt-4 border-t border-slate-700">
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-center gap-2">
                        <span class="text-sm text-slate-400">Playing as:</span>
                        <span id="current-player-name-mobile" class="font-semibold text-ap-accent">Not logged in</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Tabs for different ranking categories -->
        <div class="mb-8">
            <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                <button id="tab-games" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-ap-accent/20 text-ap-accent border border-ap-accent/30 transition-all">
                    <i class="fa-solid fa-gamepad mr-2"></i>Games Played
                </button>
                <button id="tab-time" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition-all">
                    <i class="fa-solid fa-clock mr-2"></i>Total Time
                </button>
                <button id="tab-claims" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition-all">
                    <i class="fa-solid fa-clipboard-list mr-2"></i>Total Claims
                </button>
                <button id="tab-completion" class="ranking-tab flex-1 md:flex-none px-6 py-3 rounded-lg font-semibold bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition-all">
                    <i class="fa-solid fa-percent mr-2"></i>Completion Rate
                </button>
            </div>
        </div>

        <!-- Leaderboard Table -->
        <div class="glass rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider col-rank">Rank</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider col-player">Player</th>
                            <th class="px-6 py-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider col-metric" id="metric-header">Games Played</th>
                            <th class="px-6 py-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider col-avg-time hidden md:table-cell">Avg Time/Game</th>
                            <th class="px-6 py-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider col-total-time hidden lg:table-cell">Total Time</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-700">
                        <!-- Leaderboard rows will be injected here -->
                        <tr>
                            <td colspan="5" class="px-6 py-20 text-center text-slate-500">
                                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                                <p>Loading Leaderboard...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Top Players Cards (Mobile View) -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4" id="top-players-cards">
            <!-- Top 3 cards will be injected here -->
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>Powered by <a href="https://github.com" class="underline" target="_blank" rel="noopener noreferrer">GitHub</a> & <a href="https://vercel.com" class="underline" target="_blank" rel="noopener noreferrer">Vercel</a> • Data is stored directly in the <a href="https://github.com/Ayden123kitten/The-Ultimate-Challenge" class="underline">repository</a></p>
    </footer>

    <script src="auth.js"></script>
    <script src="leaderboard.js"></script>
    <script>
        // Mobile menu toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                });
            }
            
            // Sync player name between desktop and mobile displays
            const playerNameDesktop = document.getElementById('current-player-name');
            const playerNameMobile = document.getElementById('current-player-name-mobile');
            
            if (playerNameDesktop && playerNameMobile) {
                const observer = new MutationObserver(function(mutations) {
                    playerNameMobile.textContent = playerNameDesktop.textContent;
                });
                observer.observe(playerNameDesktop, { childList: true, subtree: true, characterData: true });
            }
        });
    </script>
</body>
</html>
