<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Players - The Ultimate Challenge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ap: {
                bg: "#0f172a",
                card: "#1e293b",
                accent: "#38bdf8",
                success: "#22c55e",
                danger: "#ef4444"
              }
            }
          }
        }
      };
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .glass {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .game-logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
        flex-shrink: 0;
      }
      /* Mobile menu transition */
      #mobile-menu {
        transition: all 0.3s ease-in-out;
      }
      /* Mobile responsive styles */
      @media (max-width: 768px) {
        header .flex-col {
          gap: 0.75rem;
        }
      }
      @media (max-width: 640px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        .flex-wrap {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-700">
      <div class="max-w-7xl mx-auto px-4 py-4">
        <div
          class="flex flex-col sm:flex-row justify-between items-center gap-4"
        >
          <div
            class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start"
          >
            <a
              href="/"
              class="flex items-center gap-3 hover:opacity-80 transition-opacity"
            >
              <img
                src="/favicon.png"
                alt="Game Logo"
                class="game-logo"
                style="width: 48px; height: 48px"
              />
              <div>
                <h1 class="text-xl font-bold text-white tracking-tight">
                  The Ultimate Challenge
                </h1>
              </div>
            </a>

            <!-- Mobile menu button -->
            <button
              id="mobile-menu-btn"
              class="sm:hidden text-slate-400 hover:text-white transition-colors p-2"
            >
              <i class="fa-solid fa-bars text-xl"></i>
            </button>
          </div>

          <nav
            id="nav-container"
            class="flex items-center gap-4 flex-wrap justify-center w-full sm:w-auto"
          >
            <div
              id="current-player-display"
              class="flex items-center gap-2 text-sm"
            >
              <span class="text-slate-400 hidden sm:inline">Playing as:</span>
              <span
                id="current-player-name"
                class="font-semibold text-ap-accent"
                >Not logged in</span
              >
            </div>
            <div class="w-px h-5 bg-slate-600 hidden sm:block"></div>
            <a
              href="/"
              class="group flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
            >
              <i
                class="fa-solid fa-arrow-left group-hover:text-white transition-colors"
              ></i>
              <span class="hidden sm:inline">Back to Main Page</span>
              <span class="sm:hidden">Back</span>
            </a>
            <a
              href="/leaderboard.html"
              class="group flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
            >
              <i
                class="fa-solid fa-trophy group-hover:text-yellow-400 transition-colors"
              ></i>
              <span class="hidden sm:inline">Leaderboard</span>
            </a>
            <a
              href="#"
              id="settings-nav-link"
              onclick="
                if (typeof openModeratorModal === 'function') {
                  openModeratorModal();
                } else {
                  window.location = '/settings.html';
                }
              "
              class="group flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
            >
              <i
                class="fa-solid fa-gear group-hover:text-slate-300 transition-colors"
              ></i>
              <span class="hidden sm:inline">Settings</span>
            </a>
          </nav>
        </div>

        <!-- Mobile Menu (hidden by default) -->
        <div
          id="mobile-menu"
          class="hidden sm:hidden mt-4 pt-4 border-t border-slate-700"
        >
          <div class="flex flex-col gap-3">
            <div class="flex items-center justify-center gap-4">
              <a
                href="/"
                class="mobile-nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
                data-page="/"
              >
                <i class="fa-solid fa-gamepad"></i>
                <span class="text-sm">Games</span>
              </a>
              <a
                href="/leaderboard.html"
                class="mobile-nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
                data-page="leaderboard"
              >
                <i class="fa-solid fa-trophy"></i>
                <span class="text-sm">Leaderboard</span>
              </a>
              <a
                href="#"
                onclick="openModeratorModal()"
                class="mobile-nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
                data-page="moderation"
              >
                <i class="fa-solid fa-shield-halved"></i>
                <span class="text-sm">Moderation</span>
              </a>
              <a
                href="/settings.html"
                class="mobile-nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all"
                data-page="settings"
              >
                <i class="fa-solid fa-gear"></i>
                <span class="text-sm">Settings</span>
              </a>
            </div>
            <div class="flex items-center justify-center gap-2">
              <span class="text-sm text-slate-400">Playing as:</span>
              <span
                id="current-player-name-mobile"
                class="font-semibold text-ap-accent"
                >Not logged in</span
              >
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
      <!-- Auth panel: login / signup / logged-in state -->
      <div id="auth-panel" class="mb-8"></div>

      <!-- Search & Sort Bar -->
      <div
        class="mb-6 flex flex-col md:flex-row gap-4 justify-between items-center"
      >
        <div class="w-full md:w-auto">
          <label for="players-sort" class="text-sm text-slate-400 mr-2"
            >Sort by:</label
          >
          <select
            id="players-sort"
            class="bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
          >
            <option value="az">A-Z</option>
            <option value="za">Z-A</option>
            <option value="games-played">Games Played</option>
            <option value="total-time">Total Time</option>
            <option value="most-claims">Most Claims</option>
          </select>
        </div>
        <div class="w-full md:flex-1">
          <div class="relative">
            <i
              class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"
            ></i>
            <input
              type="text"
              id="players-search"
              placeholder="Search players..."
              class="w-full bg-slate-800/50 border border-slate-700 rounded-lg pl-12 pr-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-ap-accent focus:ring-1 focus:ring-ap-accent transition-colors"
            />
          </div>
        </div>
      </div>

      <div
        id="players-container"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"
      >
        <!-- Players will be injected here -->
        <div class="col-span-full text-center py-20 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
          <p>Loading Player Stats...</p>
        </div>
      </div>
    </main>

    <footer
      class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm"
    >
      <p>
        Powered by
        <a
          href="https://github.com"
          class="underline"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        &
        <a
          href="https://vercel.com"
          class="underline"
          target="_blank"
          rel="noopener noreferrer"
          >Vercel</a
        >
        • Data is stored directly in the
        <a
          href="https://github.com/Ayden123kitten/The-Ultimate-Challenge"
          class="underline"
          >repository</a
        >
      </p>
    </footer>

    <!-- Include app.js so moderation modal and functions are available on this page -->
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="players.js"></script>
    <!-- Moderation Panel Modal -->
    <div
      id="moderator-modal"
      class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4"
      onclick="closeModeratorModalOnClick(event)"
    >
      <div
        class="glass rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto"
        onclick="event.stopPropagation()"
      >
        <div class="p-6">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">Moderation Panel</h2>
            <button
              onclick="closeModeratorModal()"
              class="text-slate-400 hover:text-white"
            >
              <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
          </div>
          <div id="moderator-panel-content"></div>
        </div>
      </div>
    </div>
    <script>
      // Mobile menu toggle functionality
      document.addEventListener("DOMContentLoaded", function () {
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");

        if (mobileMenuBtn && mobileMenu) {
          mobileMenuBtn.addEventListener("click", function () {
            mobileMenu.classList.toggle("hidden");
          });
        }

        // Set active state for mobile nav links based on current page
        const currentPath = window.location.pathname;
        const mobileNavLinks = document.querySelectorAll(".mobile-nav-link");
        mobileNavLinks.forEach((link) => {
          const dataPage = link.getAttribute("data-page");
          if (
            (dataPage === "/" && currentPath === "/") ||
            (dataPage !== "/" && currentPath.includes(dataPage))
          ) {
            link.classList.add("bg-ap-accent/20", "text-ap-accent");
          }
        });

        // Sync player name between desktop and mobile displays
        const playerNameDesktop = document.getElementById(
          "current-player-name"
        );
        const playerNameMobile = document.getElementById(
          "current-player-name-mobile"
        );

        if (playerNameDesktop && playerNameMobile) {
          const observer = new MutationObserver(function (mutations) {
            playerNameMobile.textContent = playerNameDesktop.textContent;
          });
          observer.observe(playerNameDesktop, {
            childList: true,
            subtree: true,
            characterData: true
          });
        }
      });
    </script>
  </body>
</html>
